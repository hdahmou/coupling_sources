[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coupling-sources"
version = "0.1.0"
authors = [
    {name = "Hicham DAHMOU"}
]
requires-python = ">=3.14"
dependencies = [
  "arviz>=1.2.0",
  "fabric>=3.2.3",
  "graphviz>=0.21",
  "ipykernel>=7.3.0",
  "ipywidgets>=8.1.8",
  "jax",
  "matplotlib",
  "numpy",
  "numpyro",
  "scipy",
]

[tool.setuptools.packages.find]
include = ["coupling_sources*"]

[tool.black]
target-version = ["py314"]

[dependency-groups]
dev = [
    "black[jupyter]>=26.5.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
]
